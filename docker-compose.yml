services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: route_planner_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: docker/django.Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - backend/.env

  frontend:
    build:
      context: .
      dockerfile: docker/svelte.Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  osrm:
    image: osrm/osrm-backend
    volumes:
      - ./backend/osrm-data:/data
    ports:
      - "5000:5000"
    command: osrm-routed --algorithm mld /data/central-america-260630.osm

volumes:
  pgdata: